# Nusku - lock screen. Colours from the rendered palette; wallpaper from nusku-wallpaper.

source = ~/.config/nusku/theme/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.local/state/nusku/current-wallpaper
    color = $base
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext0
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 10
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    check_color = $yellow
    fail_color = $red
    capslock_color = $peach
    fade_on_empty = false
    placeholder_text = <span foreground="##$textAlpha">Password</span>
    position = 0, -40
    halign = center
    valign = center
}
