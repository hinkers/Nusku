# Nusku - window rules (Hyprland 0.5x+ syntax: windowrule = <effect>, match:<prop> <regex>).

# Utility windows float.
windowrule = float on, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol)$
windowrule = float on, match:class ^(\.blueman-manager-wrapped|blueman-manager)$
windowrule = float on, match:class ^(nm-connection-editor)$
# File chooser portal dialogs (GTK portal and KDE-style titles).
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, match:title ^(Open File|Open Folder|Save As|Save File|Choose .*)$

# Keep the screen awake while anything is fullscreen (video, games).
windowrule = idle_inhibit fullscreen, match:class .*
