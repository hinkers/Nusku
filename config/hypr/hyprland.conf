# Nusku - Hyprland entry point. Only sources the split files; edit those instead.
# Order matters: colours first (variables), per-machine overrides last (they win).

source = ~/.config/nusku/theme/hypr-colors.conf

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looks.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf

# Written by the installer: GPU-specific env vars / cursor workarounds.
source = ~/.config/nusku/gpu.conf
# Per-machine overrides (monitors, extra idle actions, ...). Sourced last.
source = ~/.config/nusku/local.conf
