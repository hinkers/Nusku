# Nusku - short, snappy animations (speeds are in 100 ms units, so all <= 300 ms).

animations {
    enabled = true

    bezier = ease, 0.25, 0.1, 0.25, 1.0
    bezier = snap, 0.2, 0.9, 0.3, 1.0

    animation = windows,    1, 2.5, snap, popin 90%
    animation = windowsOut, 1, 2,   ease, popin 90%
    animation = fade,       1, 2.5, ease
    animation = border,     1, 3,   ease
    animation = workspaces, 1, 2.5, snap, slide
}
