# Nusku - kitty
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

window_padding_width 8
confirm_os_window_close 0
# Hyprland sizes windows; a remembered size makes a new kitty cover the others until the next relayout.
remember_window_size no
enable_audio_bell no
scrollback_lines 10000
tab_bar_style powerline
tab_powerline_style slanted
copy_on_select clipboard

# Catppuccin Mocha (official port), then the accent overrides rendered by nusku-theme.
include mocha.conf
include ~/.config/nusku/theme/kitty-accent.conf
